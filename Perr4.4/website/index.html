<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявка на консультацию — Sintaris Assistant</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #12233f 0%, #1c3f6e 45%, #2f6fbf 100%);
    color: #fff;
    position: relative;
    overflow-x: hidden;
  }

  /* --- фон в духе главной страницы sintaris.net (декоративный, для контекста демо) --- */
  .locale-pill {
    position: absolute;
    top: 28px;
    right: 32px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
  }
  .hero {
    max-width: 720px;
    padding: 120px 56px 200px;
  }
  .hero h1 {
    font-size: 44px;
    line-height: 1.18;
    font-weight: 800;
    margin: 0 0 16px;
  }
  .hero .tagline {
    color: #ffc736;
    font-style: italic;
    font-weight: 800;
    font-size: 26px;
    margin: 0 0 14px;
  }
  .hero .subtitle {
    font-size: 19px;
    opacity: 0.92;
    margin: 0 0 36px;
  }
  .hero .actions { display: flex; gap: 16px; flex-wrap: wrap; }
  .btn-primary, .btn-secondary {
    border: none;
    border-radius: 999px;
    padding: 15px 28px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-primary { background: #ffb020; color: #1a1a2e; }
  .btn-secondary { background: #fff; color: #16233b; }

  /* --- плавающий виджет-ассистент --- */
  .launcher {
    position: fixed;
    right: 24px;
    bottom: 24px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #2f6fe0;
    border: none;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    cursor: pointer;
  }
  .launcher.visible { display: flex; }

  .widget {
    position: fixed;
    right: 24px;
    bottom: 24px;
    width: 380px;
    max-width: calc(100vw - 32px);
    height: 600px;
    max-height: calc(100vh - 48px);
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: #1f2430;
  }
  .widget.hidden { display: none; }

  .widget-header {
    background: #161f33;
    color: #fff;
    padding: 14px 12px 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #3ddc84;
    box-shadow: 0 0 0 3px rgba(61, 220, 132, 0.2);
    flex-shrink: 0;
  }
  .widget-header .title { font-weight: 700; font-size: 14px; flex: 1; }
  .icon-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(255, 255, 255, 0.12);
    border: none;
    color: #fff;
    border-radius: 999px;
    padding: 6px 11px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .close-btn {
    background: transparent;
    border: none;
    color: #cfd6e6;
    cursor: pointer;
    padding: 4px;
    display: flex;
  }

  .widget-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background: #f6f7fb;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg-block { display: flex; flex-direction: column; gap: 4px; max-width: 86%; }
  .msg-block.user { align-self: flex-end; align-items: flex-end; }
  .msg-block.assistant { align-self: flex-start; align-items: flex-start; }
  .msg-block.system { align-self: center; align-items: center; max-width: 100%; }
  .msg-label { font-size: 11px; color: #8a90a0; padding: 0 4px; }
  .msg-bubble { font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .msg-block.user .msg-bubble {
    background: #2f6fe0;
    color: #fff;
    padding: 10px 14px;
    border-radius: 14px 14px 4px 14px;
  }
  .msg-block.assistant .msg-bubble { color: #1f2430; }
  .msg-block.system .msg-bubble {
    background: #e6f7ec;
    color: #1c8a4a;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
  }

  .widget-footer {
    border-top: 1px solid #eceef3;
    background: #fff;
    padding: 12px 14px 14px;
    flex-shrink: 0;
  }
  .widget-footer form { display: flex; gap: 8px; }
  .widget-footer input[type=text] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 999px;
    border: 1px solid #dfe2ea;
    background: #f4f5f8;
    font-size: 14px;
    font-family: inherit;
  }
  .send-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #2f6fe0;
    border: none;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .send-btn:disabled { opacity: 0.5; cursor: default; }
  .consent { font-size: 11px; color: #9aa0ab; text-align: center; margin: 8px 4px 0; }
  .consent .link-like { color: #2f6fe0; }
</style>
</head>
<body>
  <span class="locale-pill">🇷🇺 RU Russian</span>

  <div class="hero">
    <h1>Автоматизируйте процессы,<br>развивайте бизнес с AI</h1>
    <p class="tagline">Smart Innovation To Rise</p>
    <p class="subtitle">От карты процессов до рабочей системы</p>
    <div class="actions">
      <button class="btn-primary" type="button">Запросить бесплатную 30-мин консультацию</button>
      <button class="btn-secondary" type="button" id="openWidget">Спросить Sintaris Assistant</button>
    </div>
  </div>

  <button class="launcher" id="launcher" aria-label="Открыть чат с ассистентом">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
      <path d="M4 4h16v12H7l-3 3V4z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="widget" id="widget">
    <div class="widget-header">
      <span class="status-dot"></span>
      <span class="title">SINTARIS Assistant</span>
      <button class="icon-btn" id="resetChat" type="button">↺ Новый чат</button>
      <button class="close-btn" id="closeWidget" type="button" aria-label="Свернуть чат">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="widget-body" id="chat"></div>

    <div class="widget-footer">
      <form id="form">
        <input id="input" type="text" placeholder="Напишите ваш вопрос…" autocomplete="off" required>
        <button type="submit" class="send-btn" id="send" aria-label="Отправить">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M3 11l18-8-8 18-2-8-8-2z" fill="#fff"/>
          </svg>
        </button>
      </form>
      <p class="consent">Используя чат, вы соглашаетесь с <span class="link-like">политикой обработки данных</span></p>
    </div>
  </div>

  <script>
    const chatEl = document.getElementById('chat');
    const formEl = document.getElementById('form');
    const inputEl = document.getElementById('input');
    const sendEl = document.getElementById('send');
    const widgetEl = document.getElementById('widget');
    const launcherEl = document.getElementById('launcher');

    function newSessionId() {
      const id = crypto.randomUUID();
      localStorage.setItem('session_id', id);
      return id;
    }

    let sessionId = localStorage.getItem('session_id') || newSessionId();

    function addMessage(role, label, text) {
      const block = document.createElement('div');
      block.className = 'msg-block ' + role;
      if (label) {
        const labelEl = document.createElement('div');
        labelEl.className = 'msg-label';
        labelEl.textContent = label;
        block.appendChild(labelEl);
      }
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = text;
      block.appendChild(bubble);
      chatEl.appendChild(block);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function startConversation() {
      chatEl.innerHTML = '';
      addMessage('assistant', 'SINTARIS Assistant', 'Здравствуйте! Расскажите, что вас интересует — помогу оформить заявку на консультацию.');
    }

    startConversation();

    document.getElementById('openWidget').addEventListener('click', () => {
      widgetEl.classList.remove('hidden');
      launcherEl.classList.remove('visible');
      inputEl.focus();
    });

    document.getElementById('closeWidget').addEventListener('click', () => {
      widgetEl.classList.add('hidden');
      launcherEl.classList.add('visible');
    });

    launcherEl.addEventListener('click', () => {
      widgetEl.classList.remove('hidden');
      launcherEl.classList.remove('visible');
    });

    document.getElementById('resetChat').addEventListener('click', () => {
      sessionId = newSessionId();
      startConversation();
    });

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;
      addMessage('user', 'Вы', text);
      inputEl.value = '';
      sendEl.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, message: text }),
        });
        if (!res.ok) throw new Error('bad response');
        const data = await res.json();
        addMessage('assistant', 'SINTARIS Assistant', data.reply);
        if (data.lead_saved) {
          addMessage('system', '', 'Заявка сохранена в общую таблицу ✓');
        }
      } catch (err) {
        addMessage('system', '', 'Ошибка соединения с сервером. Попробуйте ещё раз.');
      } finally {
        sendEl.disabled = false;
        inputEl.focus();
      }
    });
  </script>
</body>
</html>
